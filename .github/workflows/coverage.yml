name: Coverage

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: warp-ubuntu-2404-x64-4x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Prepare pinned build prerequisites
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component llvm-tools-preview
          make setup
          cargo +1.95.0 fetch --locked

      - name: Prepare sealed release artifacts
        run: make prepare

      - name: Generate Rust coverage
        run: cargo +1.95.0 llvm-cov --locked --release --workspace --all-targets --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-lcov
          path: lcov.info
