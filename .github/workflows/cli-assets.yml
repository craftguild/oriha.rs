name: CLI assets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: warp-ubuntu-2404-x64-4x
            target: x86_64-unknown-linux-gnu
          - runner: warp-macos-26-arm64-6x
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: Require the native target and clean source
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc +1.95.0 -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"
          test -z "$(git status --porcelain)"
      - name: Prepare the fixed engine and locked dependencies
        run: |
          make setup
          cargo +1.95.0 fetch --locked
      - name: Build and accept the release CLI
        run: |
          make installer INSTALLER_ARGS=--check
          make build BUILD_ARGS="--artifact oriha-cli" PROFILE=release
          make acceptance PROFILE=release
      - name: Package the verified CLI, SBOM and checksums
        run: make package PACKAGE_ARGS="--group oriha --output $RUNNER_TEMP/cli-release-assets"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cli-${{ matrix.target }}
          path: ${{ runner.temp }}/cli-release-assets/*
          if-no-files-found: error
          retention-days: 30
