[[artifacts]]
id = "native-bridge"
command = "oriha-native-bridge"
project = "oriha.rs"
kind = "rust"
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
package = "oriha-native-bridge"
supplemental = "assets/cli-supplemental.json"
inputs = ["tools/artifacts.sh", "packages/expo-oriha/scripts/native-build-utils.mjs", "packages/expo-oriha/scripts/build-rust-ios.mjs", "packages/expo-oriha/scripts/build-rust-android.mjs", "packages/expo-oriha/scripts/build-rust-macos.mjs", "packages/expo-oriha/scripts/generate-uniffi-bindings.mjs", "standards/engine.json", "standards/launcher.py", "standards/make/common.mk", "tools/android-compiler.py", "rust-toolchain.toml"]
[artifacts.build]
toolchain = "1.95.0"
[[artifacts.build.targets]]
target = "aarch64-linux-android"
compiler = ["python3", "tools/android-compiler.py"]
[[artifacts.build.targets]]
target = "armv7-linux-androideabi"
compiler = ["python3", "tools/android-compiler.py"]
[[artifacts.build.targets]]
target = "x86_64-linux-android"
compiler = ["python3", "tools/android-compiler.py"]
[artifacts.build.library]
name = "oriha_native_bridge"
formats = ["cdylib", "staticlib", "rlib"]
[artifacts.build.library.properties]
"oriha:library-target" = "oriha_native_bridge"
"oriha:graph-scope" = "Selected target and effective features; normal Cargo dependencies only. Excludes development, build and proc-macro edges. Native system SDK dependencies are not inferred."

