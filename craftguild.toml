schema_version = 2
rust_output_layout = "standard"
standards_version = "0.1.0"

[[releases]]
id = "oriha"
initial_version = "0.1.0"
tag_prefix = "v"
notes = "docs/releases"
paths = ["Cargo.toml", "Cargo.lock", "crates", "packages/expo-oriha", "Makefile", "tools", "scripts", "assets", "docs", "standards", "craftguild.toml", "README.md", "THIRD_PARTY_NOTICES.md", "LICENSE", "LICENSE-MIT", "LICENSE-APACHE", ".github", "rust-toolchain.toml"]
[[releases.cargo]]
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
workspace = true
packages = ["oriha", "oriha-core", "oriha-diagram", "oriha-i18n", "oriha-latex", "oriha-mermaid", "oriha-native-bridge", "oriha-plantuml", "oriha-stats-client", "oriha-stats-ingest", "oriha-stats-schema", "oriha-stats-viewer", "oriha-uniffi-bindgen", "oriha-wasm", "oriha-windows-bridge"]
[[releases.npm]]
manifest = "packages/expo-oriha/package.json"
lockfile = "packages/expo-oriha/package-lock.json"

[[releases]]
id = "font-registry"
initial_version = "0.1.0"
tag_prefix = "font-registry-v"
notes = "docs/releases/font-registry"
paths = ["packages/font-registry"]
[[releases.npm]]
manifest = "packages/font-registry/package.json"
lockfile = "packages/font-registry/package-lock.json"

[[releases]]
id = "expo-preview"
initial_version = "0.1.0"
tag_prefix = "expo-preview-v"
notes = "docs/releases/expo-preview"
paths = ["examples/expo-preview"]
[[releases.npm]]
manifest = "examples/expo-preview/package.json"
lockfile = "examples/expo-preview/package-lock.json"

[[policies]]
kind = "publication"
repository = "craftguild/oriha.rs"
manifest = "Cargo.toml"
npm_lockfiles = ["packages/expo-oriha/package-lock.json", "packages/font-registry/package-lock.json", "examples/expo-preview/package-lock.json"]

[[policies]]
kind = "dependencies"
manifest = "Cargo.toml"
[policies.layers]
"oriha" = ["oriha-core"]
"oriha-core" = ["oriha-i18n", "oriha-latex", "oriha-mermaid", "oriha-plantuml"]
"oriha-diagram" = []
"oriha-i18n" = []
"oriha-latex" = []
"oriha-mermaid" = ["oriha-diagram"]
"oriha-native-bridge" = ["oriha-core", "oriha-i18n", "oriha-stats-client"]
"oriha-plantuml" = ["oriha-diagram"]
"oriha-stats-client" = ["oriha-core", "oriha-stats-schema"]
"oriha-stats-ingest" = ["oriha-core", "oriha-stats-schema"]
"oriha-stats-schema" = ["oriha-core"]
"oriha-stats-viewer" = ["oriha-core"]
"oriha-uniffi-bindgen" = []
"oriha-wasm" = ["oriha-core"]
"oriha-windows-bridge" = ["oriha-native-bridge"]

[[artifacts]]
id = "oriha-cli"
command = "oriha"
project = "oriha.rs"
kind = "rust"
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
package = "oriha"
inputs = ["crates/cli/assets/banner.txt", "Makefile", "tools/standards.sh", "standards/engine.json", "standards/launcher.py", "standards/make/common.mk", "rust-toolchain.toml"]
supplemental = "assets/cli-supplemental.json"
[artifacts.build]
toolchain = "1.95.0"

[[artifacts]]
id = "expo-js"
command = "expo-oriha-js"
project = "oriha.rs"
kind = "frontend"
manifest = "packages/expo-oriha/package.json"
lockfile = "packages/expo-oriha/package-lock.json"
package = "expo-oriha"
target = "react-native"
inputs = ["packages/expo-oriha/tsdown.config.mts", "packages/expo-oriha/scripts/bundle-evidence.mjs", "packages/expo-oriha/scripts/build-js-evidence.mjs", "packages/expo-oriha/scripts/generate-third-party-licenses.mjs"]
input_dirs = ["packages/expo-oriha/.craftguild/bundle/inputs"]
supplemental = "packages/expo-oriha/.craftguild/bundle/supplemental.json"

[artifacts.bundle]
lockfile = "packages/expo-oriha/package-lock.json"
metafile = "packages/expo-oriha/.craftguild/bundle/metafile.json"
directory = "packages/expo-oriha/dist"
root = "packages/expo-oriha"
command = ["node", "packages/expo-oriha/scripts/build-js-evidence.mjs"]

[[artifacts]]
id = "font-registry"
command = "oriha-font-registry"
project = "oriha.rs"
kind = "frontend"
manifest = "packages/font-registry/package.json"
lockfile = "packages/font-registry/package-lock.json"
package = "oriha-font-registry"
target = "vercel-nodejs24"
inputs = ["packages/font-registry/astro.config.mjs", "packages/font-registry/registry.config.json", "packages/font-registry/scripts/build-evidence.mjs", "packages/font-registry/scripts/bundle-evidence.mjs", "packages/font-registry/scripts/deployment-injection.mjs", "packages/font-registry/scripts/deployment-notices.mjs", "packages/font-registry/scripts/registry-assets.mjs", "packages/font-registry/scripts/build-registry.ts", "packages/font-registry/scripts/registry-provenance.ts"]
input_dirs = ["packages/font-registry/generated", "packages/font-registry/licenses", "packages/font-registry/.craftguild/bundle/inputs"]
supplemental = "packages/font-registry/.craftguild/bundle/supplemental.json"
[artifacts.bundle]
lockfile = "packages/font-registry/package-lock.json"
metafile = "packages/font-registry/.craftguild/bundle/metafile.json"
directory = "packages/font-registry/.vercel/output"
root = "packages/font-registry"
command = ["node", "packages/font-registry/scripts/build-evidence.mjs"]

[[generated]]
owner = "oriha-character-references"
manifest = "assets/generated-character-references.json"
output_root = "crates/core/src/character_reference"
reproduce = ["python3", "crates/core/scripts/generate-character-references.py", "--output-dir", "{output}"]
rust_size_exception = true

[[adapters]]
language = "rust"
test = ["cargo", "test", "--locked", "--release", "--workspace", "--all-targets"]
format = ["python3", "tools/rust-format.py"]
lint = ["cargo", "clippy", "--locked", "--release", "--workspace", "--all-targets", "--", "-D", "warnings"]

[[adapters]]
language = "npm"
test = ["node", "tools/npm-checks.mjs", "test"]
lint = ["node", "tools/npm-checks.mjs", "lint"]
typecheck = ["node", "tools/npm-checks.mjs", "typecheck"]

[[commands]]
id = "release-version-ownership"
purpose = "Validate all Cargo/npm release authorities and candidate edits in memory without signing or changing versions"
phase = "check"
argv = ["sh", "tools/standards.sh", "check-release-config"]

[[commands]]
id = "block-exhaustiveness"
purpose = "Keep parser/render block enum handling exhaustive"
phase = "check"
argv = ["python3", "scripts/check-block-exhaustiveness.py"]

[[commands]]
id = "rust-dependency-audit"
purpose = "Retain advisory, version-ban, license and source audits for the locked Rust graph"
phase = "check"
argv = ["cargo", "deny", "check", "advisories", "bans", "licenses", "sources"]

[[commands]]
id = "third-party-notices"
purpose = "Reproduce the selected native target graphs and bundled font/data/icon license inventory"
phase = "check"
argv = ["python3", "tools/check-licenses.py"]

[[commands]]
id = "font-license-provenance"
purpose = "Validate the complete configured font license inventory and pinned upstream source hashes without network"
phase = "check"
argv = ["node", "tools/check-font-licenses.mjs"]

[[commands]]
id = "javascript-distribution"
purpose = "Verify the operation-prepared ESM/CJS/declarations, actual module evidence and selected SBOM"
phase = "check"
argv = ["sh", "tools/standards.sh", "verify-frontend", "--artifact", "expo-js"]

[[commands]]
id = "native-binding-checksums"
purpose = "Generate isolated Swift/Kotlin bindings and compare their ABI checksums with the actual host library"
phase = "check"
argv = ["python3", "tools/check-bindings.py"]

[[commands]]
id = "image-data-urls"
purpose = "Decode real rendered data URL images and verify browser source selection"
phase = "check"
argv = ["python3", "scripts/check-image-data-urls.py"]

[[commands]]
id = "font-registry-runtime"
purpose = "Exercise the real generated deployment on an owned ephemeral port and compare registry/font/license bytes and headers"
phase = "acceptance"
argv = ["node", "tools/check-font-runtime.mjs"]

[[generated]]
owner = "oriha-expo-bridge-and-icons"
manifest = ".craftguild/ownership/expo.json"
output_root = "packages/expo-oriha/generated"
reproduce = ["node", "tools/generate-expo.mjs", "--output-dir", "{output}"]

[[generated]]
owner = "oriha-emoji-shortcodes"
manifest = "assets/generated-emoji-shortcodes.json"
output_root = "crates/core/src/emoji/generated"
reproduce = ["node", "crates/core/scripts/generate-emoji-shortcodes.mjs", "--output-dir", "{output}"]
rust_size_exception = true


